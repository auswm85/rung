name-template: "v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"
categories:
  # Labels excluded from the changelog and version resolution
  - type: "pre-exclude"
    when:
      labels:
        - "skip-changelog"
        - "extension"
        - "test"
  # Changelog categories (labels that also drive version resolution
  # carry a semver-increment)
  - title: "🚀 Features"
    semver-increment: "minor"
    when:
      labels:
        - "enhancement"
        - "feature"
  - title: "🐛 Bug Fixes"
    semver-increment: "patch"
    when:
      labels:
        - "bug"
        - "fix"
  - title: "♻️ Refactoring"
    when:
      labels:
        - "refactor"
  - title: "🧹 Maintenance"
    when:
      labels:
        - "chore"
        - "dependencies"
  - title: "📚 Documentation"
    when:
      labels:
        - "documentation"
        - "docs"
  # Version-resolver-only labels (no changelog category of their own)
  - type: "version-resolver"
    semver-increment: "major"
    when:
      labels:
        - "major"
        - "breaking"
  - type: "version-resolver"
    semver-increment: "minor"
    when:
      labels:
        - "minor"
  - type: "version-resolver"
    semver-increment: "patch"
    when:
      labels:
        - "patch"
change-template: "- $TITLE @$AUTHOR (#$NUMBER)"
change-title-escapes: '\<*_&'
version-resolver:
  default: patch
autolabeler:
  - label: "extension"
    title:
      - "/\\(extension\\)/i"
  - label: "chore"
    title:
      - "/^chore/i"
  - label: "enhancement"
    title:
      - "/^feat/i"
  - label: "bug"
    title:
      - "/^fix/i"
  - label: "documentation"
    title:
      - "/^docs/i"
  - label: "refactor"
    title:
      - "/^refactor/i"
  - label: "test"
    title:
      - "/^test/i"
template: |
  ## What's Changed

  $CHANGES

  **Full Changelog**: https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION
